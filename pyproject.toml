[project]
name = "bern-archives-apertus"
version = "0.1.0"
description = "Evidence-preserving Stapfer archival data and Apertus demonstrator"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "gradio>=5,<7",
  "huggingface-hub==2.2.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
review-auth = ["authlib>=1.6,<2", "itsdangerous>=2.2,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
